events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name api.ch-tech.dev;

        # Webroot usado por certbot para el desafío HTTP-01 (renovación de
        # Let's Encrypt), ver docker-compose.prod.yml.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.ch-tech.dev;

        ssl_certificate     /etc/letsencrypt/live/api.ch-tech.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ch-tech.dev/privkey.pem;

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
