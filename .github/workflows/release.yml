name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push backend image to ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # Rol asumido vía OIDC (sin AWS_ACCESS_KEY_ID/SECRET de larga duración
      # como secretos del repo), ver ADR-0011.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ch-tech-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/backend/Dockerfile.prod \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  migrate:
    name: Run Alembic migrations against RDS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Paso explícito y separado del arranque del contenedor, para aplicar
      # el esquema nuevo antes de que la instancia empiece a servir tráfico
      # con la imagen nueva (ver ADR-0011). Usa la credencial chtech_migrator
      # (MIGRATION_DATABASE_URL) — nunca la de la app en ejecución. Requiere
      # que RDS sea alcanzable desde el runner (seguridad de red es
      # responsabilidad de la infraestructura, no de este workflow).
      - name: Migrate database
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: docker run --rm -e MIGRATION_DATABASE_URL "${{ needs.build-and-push.outputs.image }}" alembic upgrade head

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SSM Run Command en vez de SSH: no requiere abrir el puerto 22 a
      # internet ni guardar una clave privada como secreto (ver ADR-0011).
      # La instancia necesita el SSM Agent y un IAM instance profile con
      # AmazonSSMManagedInstanceCore (paso manual, ver ADR-0011).
      - name: Deploy new image on the EC2 instance
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/ch-tech\", \"sed -i 's|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$BACKEND_IMAGE|' .env\", \"docker compose -f docker-compose.prod.yml pull backend\", \"docker compose -f docker-compose.prod.yml up -d\"]" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
